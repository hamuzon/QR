# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject Canonical Tag and FQDN script
        run: |
          node <<'EOF'
          const fs = require('fs');
          const canonicalDomain = process.env.CANONICAL_DOMAIN || 'hamuzon.github.io/QR';
          fs.readdirSync('.').forEach(file => {
            if (file.endsWith('.html') && !file.startsWith('google')) {
              let content = fs.readFileSync(file, 'utf8');
              content = content.replace(/<link rel=["']canonical["'][^>]*>/gi, '');
              const canonicalPath = file === 'index.html' ? '/' : `/${file}`;
              const canonicalTag = `  <link rel="canonical" href="https://${canonicalDomain}${canonicalPath}" />`;
              const fqdnScript = `  <script>if(window.location.hostname.endsWith(".")){window.location.replace(window.location.href.replace(window.location.hostname,window.location.hostname.slice(0,-1)));}</script>`;
              if (content.includes('<head>')) {
                content = content.replace('<head>', `<head>\n${canonicalTag}\n${fqdnScript}`);
                fs.writeFileSync(file, content, 'utf8');
                console.log(`Injected into ${file}`);
              }
            }
          });
          EOF
      - name: Remove sensitive files from deployment artifact
        run: |
          # デプロイ対象から削除
          rm -rf functions README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
